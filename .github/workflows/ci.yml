name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Everything that needs neither a database nor an API key. Fast enough that a
  # developer will wait for it, so it gates the expensive job below.
  unit:
    name: lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check src tests evaluation
      - name: mypy --strict
        run: mypy
      - name: unit tests
        run: pytest -q -m 'not integration and not mcp'

  integration:
    name: integration (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ek
          POSTGRES_PASSWORD: ek
          POSTGRES_DB: enterprise_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ek -d enterprise_knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service container starts empty -- schema.sql is applied by the test
      # suite itself through PostgresStorage.apply_schema(), which is the code
      # path we want covered rather than a psql invocation that bypasses it.
      EK_DATABASE_URL: postgresql://ek:ek@localhost:5432/enterprise_knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: apply schema
        run: |
          python - <<'PY'
          import pathlib
          from enterprise_knowledge.config import load_settings
          from enterprise_knowledge.storage import PostgresStorage
          store = PostgresStorage(load_settings())
          store.apply_schema(pathlib.Path("schema.sql").read_text(encoding="utf-8"))
          store.close()
          print("schema applied")
          PY
      - name: integration tests
        run: pytest -q -m integration

      # Deliberately not gating on MCP tests yet: every test in tests/mcp/ is an
      # xfail placeholder until Phase 5, so a green run there would mean nothing.
      # Add `-m mcp` here in the same change that implements build_mcp_server.
