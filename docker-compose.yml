# enterprise-knowledge :: local development stack (§22)
#
#   docker compose up -d && make schema
#
# Port 55433 is used because 55432 is already taken on this host by another
# project's postgres. Override with POSTGRES_PORT in .env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ek}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_knowledge}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - ek_pgdata:/var/lib/postgresql/data
      # Applied only on first boot of an empty volume. `make schema` is the
      # idempotent path for an existing database.
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ek} -d ${POSTGRES_DB:-enterprise_knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ek_pgdata:
